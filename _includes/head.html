<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

{%- assign page_title = page.title | default: site.title -%}
{%- assign page_desc = page.summary | default: page.description | default: site.description -%}
<title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}</title>
<meta name="description" content="{{ page_desc | strip_newlines | strip }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">

<meta property="og:type" content="{% if page.collection == 'writing' %}article{% else %}website{% endif %}">
<meta property="og:title" content="{{ page_title }}">
<meta property="og:description" content="{{ page_desc | strip_newlines | strip }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:site_name" content="{{ site.title }}">
<meta name="twitter:card" content="summary">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400;1,600&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
