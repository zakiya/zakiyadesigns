# ---- Content ---------------------------------------------------------------
# One content type: Posts. Publishing means adding ONE .md file to _entries/.
# Nothing else needs to change — the landing page and the Posts index read the
# collection directly.
#
# The directory is `_entries/` rather than `_posts/` on purpose: Jekyll reserves
# `posts` for its built-in collection, which silently drops any file whose name
# is not prefixed YYYY-MM-DD. Posts here are dated by front matter (`date:`) or
# by `year:` alone, so filenames stay clean.
collections:
  entries:
    output: true
    permalink: /posts/:name/

defaults:
  - scope:
      path: ""
      type: entries
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: page

# ---- Build ----------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

sass:
  style: compressed

# `pages/` is unrelated San Diego Sirens tooling that shares this repo.
# Its two HTML reports are already served at their current URLs, so the
# directory stays in the build — but none of its source or dependencies do.
exclude:
  - node_modules/
  - pages/node_modules/
  - pages/src/
  - pages/.vscode/
  - pages/package.json
  - pages/package-lock.json
  - pages/LINKCHECKER.md
  - pages/blc-emails.md
  - pages/blc-sorted.md
  - pages/blc-full.md
  - Gemfile
  - Gemfile.lock
  - README.md
  - .claude/
  - .idea/
  - .vscode/
  - vendor/
