---
layout: default
---
<div class="container">
  <article>
    <h1 class="page-title">{{ page.title }}</h1>
    <p class="entry-meta">
      {%- if page.date %}<span>{{ page.date | date: "%B %-d, %Y" }}</span>{% endif -%}
      {%- if page.kind %}<span class="badge badge--{{ page.kind }}">{{ page.kind }}</span>{% endif -%}
    </p>
    {%- if page.summary %}<p class="lead page-intro">{{ page.summary }}</p>{% endif -%}
    <div class="prose">
      {{ content }}
    </div>
  </article>
</div>
